<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - Manajemen Akun NutriCare</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #628749;
            --primary-dark: #52763c;
            --bg: #f4f7f1;
            --surface: #ffffff;
            --text: #273322;
            --text-muted: #6f7969;
            --border: #dfe6da;
            --danger: #dc3545;
            --success: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.6;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        header {
            background: var(--surface);
            border-bottom: 2px solid var(--primary);
            padding: 20px 0;
            margin-bottom: 30px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        h1 {
            font-size: 24px;
            color: var(--primary);
        }

        .subtitle {
            font-size: 14px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .status {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-badge.connected {
            background: #d4edda;
            color: #155724;
        }

        .status-badge.disconnected {
            background: #f8d7da;
            color: #721c24;
        }

        .panel {
            background: var(--surface);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .panel-title {
            font-size: 18px;
            font-weight: 600;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 16px;
            margin-bottom: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        label {
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text);
        }

        label .required {
            color: var(--danger);
        }

        input, select, textarea {
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        input:focus, select:focus, textarea:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(98, 135, 73, 0.1);
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-secondary {
            background: var(--border);
            color: var(--text);
        }

        .btn-secondary:hover {
            background: #c9d5c4;
        }

        .btn-danger {
            background: var(--danger);
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 12px;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead {
            background: #f8faf7;
        }

        th {
            text-align: left;
            padding: 12px;
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border);
        }

        td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            font-size: 14px;
        }

        tbody tr:hover {
            background: #fafbfa;
        }

        .role-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .role-badge.ahli-gizi {
            background: #fff3e0;
            color: #e65100;
        }

        .role-badge.waiter {
            background: #e0f2f1;
            color: #00695c;
        }

        .role-badge.logistik {
            background: #ede7f6;
            color: #4527a0;
        }

        .role-badge.dapur {
            background: #fff8e1;
            color: #b78103;
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .alert {
            padding: 12px 16px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .alert-info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--surface);
            border-radius: 12px;
            max-width: 500px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        }

        .modal-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
        }

        .modal-body {
            padding: 24px;
        }

        .modal-footer {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 16px;
            opacity: 0.3;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }

        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .search-box {
            position: relative;
            margin-bottom: 20px;
        }

        .search-box input {
            width: 100%;
            padding-left: 40px;
        }

        .search-box::before {
            content: '🔍';
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 16px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(98, 135, 73, 0.2);
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 13px;
            opacity: 0.9;
        }

        /* ===== Foto profil ===== */
        .admin-key {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .admin-key input {
            width: 180px;
            padding: 8px 10px;
            font-size: 13px;
        }

        .photo-cell {
            min-width: 168px;
        }

        .photo-preview {
            position: relative;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            overflow: hidden;
            background: var(--primary);
            color: #fff;
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 16px;
            margin-bottom: 8px;
        }

        .photo-preview img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .photo-actions .btn {
            padding: 4px 8px;
            font-size: 11px;
        }
    </style>
    <link rel="icon" href="/favicon.ico?v=1" type="image/x-icon">
</head>
<body>
    <header>
        <div class="container">
            <div>
                <h1>🔐 Admin Panel - Manajemen Akun</h1>
                <div class="subtitle">Sistem Integrasi User NutriCare</div>
            </div>
            <div class="status">
                <div class="admin-key">
                    <input type="password" id="adminKey" placeholder="Kunci admin" autocomplete="off"
                           title="Diperlukan untuk mengubah atau menghapus foto profil">
                    <button class="btn btn-secondary btn-sm" onclick="saveAdminKey()">Simpan</button>
                </div>
                <div class="status-badge" id="connectionStatus">
                    <span id="statusText">Memeriksa...</span>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="alertContainer"></div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-value" id="totalUsers">0</div>
                <div class="stat-label">Total Pengguna</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #e65100 0%, #bf360c 100%);">
                <div class="stat-value" id="totalGizi">0</div>
                <div class="stat-label">Ahli Gizi</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #00695c 0%, #004d40 100%);">
                <div class="stat-value" id="totalWaiter">0</div>
                <div class="stat-label">Waiter</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #4527a0 0%, #311b92 100%);">
                <div class="stat-value" id="totalLogistik">0</div>
                <div class="stat-label">Logistik</div>
            </div>
            <div class="stat-card" style="background: linear-gradient(135deg, #d97706 0%, #b45309 100%);">
                <div class="stat-value" id="totalDapur">0</div>
                <div class="stat-label">Dapur</div>
            </div>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Tambah Pengguna Baru</div>
            </div>
            
            <form id="userForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="email" required placeholder="contoh@nutricare.com">
                    </div>
                    <div class="form-group">
                        <label>Password <span class="required">*</span></label>
                        <input type="password" id="password" required minlength="8" placeholder="Minimal 8 karakter">
                    </div>
                </div>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="nama" required placeholder="Nama lengkap">
                    </div>
                    <div class="form-group">
                        <label>Role <span class="required">*</span></label>
                        <select id="role" required>
                            <option value="">Pilih role...</option>
                            <option value="ahli-gizi">Ahli Gizi</option>
                            <option value="waiter">Waiter</option>
                            <option value="logistik">Logistik</option>
                            <option value="dapur">Dapur</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Nomor Telepon</label>
                    <input type="tel" id="telepon" placeholder="08xx-xxxx-xxxx">
                </div>

                <div style="display: flex; gap: 12px; margin-top: 20px;">
                    <button type="submit" class="btn btn-primary">
                        ➕ Tambah Pengguna
                    </button>
                    <button type="button" class="btn btn-secondary" onclick="resetForm()">
                        🔄 Reset Form
                    </button>
                </div>
            </form>
        </div>

        <div class="panel">
            <div class="panel-header">
                <div class="panel-title">Daftar Pengguna</div>
                <button class="btn btn-secondary btn-sm" onclick="loadUsers()">
                    🔄 Refresh
                </button>
            </div>

            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Cari berdasarkan nama atau email...">
            </div>

            <div id="tableContainer">
                <div class="loading">
                    <div class="spinner"></div>
                    <div>Memuat data pengguna...</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Edit -->
    <div class="modal" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <div class="modal-title">Edit Pengguna</div>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    <div class="form-group">
                        <label>Email <span class="required">*</span></label>
                        <input type="email" id="editEmail" required>
                    </div>
                    <div class="form-group">
                        <label>Nama Lengkap <span class="required">*</span></label>
                        <input type="text" id="editNama" required>
                    </div>
                    <div class="form-group">
                        <label>Role <span class="required">*</span></label>
                        <select id="editRole" required>
                            <option value="ahli-gizi">Ahli Gizi</option>
                            <option value="waiter">Waiter</option>
                            <option value="logistik">Logistik</option>
                            <option value="dapur">Dapur</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Nomor Telepon</label>
                        <input type="tel" id="editTelepon">
                    </div>
                    <div class="form-group">
                        <label>Password Baru</label>
                        <input type="password" id="editPassword" placeholder="Kosongkan jika tidak diubah">
                        <small style="color: var(--text-muted); font-size: 12px;">
                            Minimal 8 karakter jika ingin mengubah password
                        </small>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">Batal</button>
                <button class="btn btn-primary" onclick="updateUser()">Simpan Perubahan</button>
            </div>
        </div>
    </div>

    <script>
        // Panel admin harus dibuka lewat server: http://localhost:3017/admin-panel.html
        // Kalau berkas ini diklik dua kali (file://), browser menganggap asal "null"
        // sehingga semua permintaan ke API diblokir CORS. Pindahkan otomatis ke server.
        if (location.protocol === 'file:') {
            location.replace('http://localhost:3017/admin-panel.html');
        }
        // Saat disajikan server, pakai origin yang sama supaya bebas CORS.
        const API_BASE = location.protocol === 'file:' ? 'http://localhost:3017' : location.origin;
        let users = [];

        // Check connection
        async function checkConnection() {
            try {
                const res = await fetch(`${API_BASE}/api/health`);
                if (res.ok) {
                    document.getElementById('connectionStatus').className = 'status-badge connected';
                    document.getElementById('statusText').textContent = 'Terhubung';
                } else {
                    throw new Error('Server error');
                }
            } catch (err) {
                document.getElementById('connectionStatus').className = 'status-badge disconnected';
                document.getElementById('statusText').textContent = 'Terputus';
                showAlert('Tidak dapat terhubung ke server NutriCare. Pastikan server berjalan di port 3017.', 'error');
            }
        }

        // Show alert
        function showAlert(message, type = 'info') {
            const container = document.getElementById('alertContainer');
            const alert = document.createElement('div');
            alert.className = `alert alert-${type}`;
            alert.textContent = message;
            container.appendChild(alert);
            
            setTimeout(() => {
                alert.remove();
            }, 5000);
        }

        // Load users
        async function loadUsers() {
            try {
                if (!getAdminKey()) {
      showAlert('Masukkan kunci admin di bagian atas halaman untuk memuat daftar pengguna.', 'error');
      document.getElementById('adminKey').focus();
      return;
    }
    const res = await fetch(`${API_BASE}/api/admin/users`, { headers: adminHeaders() });
    if (res.status === 401 || res.status === 403) {
      showAlert('Kunci admin kosong atau salah. Periksa kembali kunci di bagian atas halaman.', 'error');
      document.getElementById('adminKey').focus();
      return;
    }
                if (!res.ok) throw new Error('Failed to load users');
                
                const data = await res.json();
                users = data.users || [];
                renderTable(users);
                updateStats(users);
            } catch (err) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">⚠️</div>
                        <p>Gagal memuat data pengguna.</p>
                        <p style="font-size: 12px; margin-top: 8px;">Error: ${err.message}</p>
                    </div>
                `;
            }
        }

        // Update stats
        function updateStats(users) {
            document.getElementById('totalUsers').textContent = users.length;
            document.getElementById('totalGizi').textContent = users.filter(u => u.role === 'ahli-gizi').length;
            document.getElementById('totalWaiter').textContent = users.filter(u => u.role === 'waiter').length;
            document.getElementById('totalLogistik').textContent = users.filter(u => u.role === 'logistik').length;
            const elDapur = document.getElementById('totalDapur');
            if (elDapur) elDapur.textContent = users.filter(u => u.role === 'dapur').length;
        }

        // Render table
        function renderTable(data) {
            if (data.length === 0) {
                document.getElementById('tableContainer').innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p>Belum ada pengguna terdaftar.</p>
                    </div>
                `;
                return;
            }

            const html = `
                <div class="table-wrapper">
                    <table>
                        <thead>
                            <tr>
                                <th>Foto</th>
                                <th>Email</th>
                                <th>Nama</th>
                                <th>Role</th>
                                <th>Telepon</th>
                                <th>Status</th>
                                <th>Aksi</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${data.map(user => `
                                <tr>
                                    <td class="photo-cell">
                                        <div class="photo-preview" data-preview="${user.id}">${photoInner(user)}</div>
                                        <div class="photo-actions" data-actions="${user.id}">
                                            <button class="btn btn-secondary btn-sm" onclick="pickPhoto('${user.id}')">Ubah foto</button>
                                            <button class="btn btn-secondary btn-sm" onclick="removePhoto('${user.id}')">Hapus foto</button>
                                        </div>
                                        <div class="photo-actions" data-confirm="${user.id}" style="display:none;">
                                            <button class="btn btn-primary btn-sm" data-save="${user.id}" onclick="uploadPhoto('${user.id}')">Simpan</button>
                                            <button class="btn btn-secondary btn-sm" onclick="cancelPhoto('${user.id}')">Batal</button>
                                        </div>
                                        <input type="file" id="file-${user.id}" accept="image/jpeg,image/png,image/webp" hidden
                                               onchange="previewPhoto('${user.id}', this)">
                                    </td>
                                    <td>${esc(user.email)}</td>
                                    <td>${esc(user.nama)}</td>
                                    <td><span class="role-badge ${user.role}">${getRoleLabel(user.role)}</span></td>
                                    <td>${user.telepon || '-'}</td>
                                    <td>${user.aktif ? '✅ Aktif' : '❌ Nonaktif'}</td>
                                    <td class="actions">
                                        <button class="btn btn-secondary btn-sm" onclick="openEditModal('${user.id}')">
                                            ✏️ Edit
                                        </button>
                                        <button class="btn btn-danger btn-sm" onclick="deleteUser('${user.id}', '${user.email}')">
                                            🗑️ Hapus
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                </div>
            `;
            document.getElementById('tableContainer').innerHTML = html;
        }

        function getRoleLabel(role) {
            const labels = {
                admin: 'Admin',
                'ahli-gizi': 'Ahli Gizi',
                gizi: 'Ahli Gizi',
                waiter: 'Waiter',
                logistik: 'Logistik',
                dapur: 'Dapur'
            };
            return labels[role] || role;
        }

        // ===== Foto profil (khusus admin) =====
        const ADMIN_KEY_STORAGE = 'nutricare-admin-key';
        const pendingPhotos = new Map();
        const MAX_PHOTO_MB = 2;
        const ALLOWED_PHOTO_TYPES = ['image/jpeg', 'image/png', 'image/webp'];

        function esc(value) {
            return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        // Semua panggilan /api/admin wajib menyertakan kunci admin.
  function adminHeaders(extra) {
    const key = getAdminKey();
    return Object.assign({}, extra || {}, key ? { 'X-NC-Admin-Key': key } : {});
  }

  function getAdminKey() {
            return sessionStorage.getItem(ADMIN_KEY_STORAGE) || '';
        }

        function saveAdminKey() {
            const input = document.getElementById('adminKey');
            const value = input.value.trim();
            if (!value) {
                showAlert('Kunci admin tidak boleh kosong.', 'error');
                input.focus();
                return;
            }
            sessionStorage.setItem(ADMIN_KEY_STORAGE, value);
            showAlert('Kunci admin disimpan untuk sesi ini.', 'success');
        }

        function initialOf(user) {
            return ((user && user.nama) || '?').trim().charAt(0).toUpperCase() || '?';
        }

        function photoInner(user) {
            const img = user && user.foto_profil
                ? `<img src="${esc(user.foto_profil)}" alt="Foto profil ${esc(user.nama)}" onerror="this.remove()">`
                : '';
            return `<span class="photo-initial">${esc(initialOf(user))}</span>${img}`;
        }

        function setPhotoButtons(id, mode) {
            const actions = document.querySelector(`[data-actions="${id}"]`);
            const confirmBox = document.querySelector(`[data-confirm="${id}"]`);
            if (actions) actions.style.display = mode === 'preview' ? 'none' : 'flex';
            if (confirmBox) confirmBox.style.display = mode === 'preview' ? 'flex' : 'none';
        }

        function pickPhoto(id) {
            const input = document.getElementById('file-' + id);
            if (input) input.click();
        }

        function previewPhoto(id, input) {
            const file = input.files && input.files[0];
            if (!file) return;

            if (!ALLOWED_PHOTO_TYPES.includes(file.type)) {
                showAlert('Format file tidak didukung. Gunakan foto JPG, PNG, atau WEBP.', 'error');
                input.value = '';
                return;
            }

            if (file.size > MAX_PHOTO_MB * 1024 * 1024) {
                showAlert(`Ukuran foto maksimal ${MAX_PHOTO_MB} MB.`, 'error');
                input.value = '';
                return;
            }

            pendingPhotos.set(id, file);

            const box = document.querySelector(`[data-preview="${id}"]`);
            const user = users.find(u => u.id === id);
            if (box) {
                box.innerHTML = `<span class="photo-initial">${esc(initialOf(user))}</span>`
                    + `<img src="${URL.createObjectURL(file)}" alt="Pratinjau foto">`;
            }

            setPhotoButtons(id, 'preview');
        }

        function cancelPhoto(id) {
            const input = document.getElementById('file-' + id);
            if (input) input.value = '';
            pendingPhotos.delete(id);

            const box = document.querySelector(`[data-preview="${id}"]`);
            const user = users.find(u => u.id === id);
            if (box) box.innerHTML = photoInner(user);

            setPhotoButtons(id, 'idle');
        }

        async function uploadPhoto(id) {
            const file = pendingPhotos.get(id);
            if (!file) {
                showAlert('Pilih file foto terlebih dahulu.', 'error');
                return;
            }

            const key = getAdminKey();
            if (!key) {
                showAlert('Masukkan kunci admin di bagian atas halaman untuk mengubah foto profil.', 'error');
                document.getElementById('adminKey').focus();
                return;
            }

            const button = document.querySelector(`[data-save="${id}"]`);
            if (button) {
                button.disabled = true;
                button.textContent = 'Menyimpan...';
            }

            try {
                const form = new FormData();
                form.append('foto', file);

                const res = await fetch(`${API_BASE}/api/admin/users/${id}/foto-profil`, {
                    method: 'POST',
                    headers: { 'X-NC-Admin-Key': key },
                    body: form
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'Foto gagal diunggah.');

                pendingPhotos.delete(id);
                showAlert('✅ ' + (data.message || 'Foto profil berhasil diperbarui.'), 'success');
                await loadUsers();
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
                if (button) {
                    button.disabled = false;
                    button.textContent = 'Simpan';
                }
            }
        }

        async function removePhoto(id) {
            const user = users.find(u => u.id === id);

            if (user && !user.foto_profil) {
                showAlert('Pengguna ini belum memiliki foto profil.', 'info');
                return;
            }

            if (!confirm(`Hapus foto profil ${user ? user.nama : 'pengguna ini'}? Avatar akan kembali ke inisial.`)) return;

            const key = getAdminKey();
            if (!key) {
                showAlert('Masukkan kunci admin di bagian atas halaman untuk menghapus foto profil.', 'error');
                document.getElementById('adminKey').focus();
                return;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}/foto-profil`, {
                    method: 'DELETE',
                    headers: { 'X-NC-Admin-Key': key }
                });

                const data = await res.json().catch(() => ({}));
                if (!res.ok) throw new Error(data.message || 'Foto gagal dihapus.');

                showAlert('✅ ' + (data.message || 'Foto profil berhasil dihapus.'), 'success');
                await loadUsers();
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
            }
        }

        // Add user
        document.getElementById('userForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const data = {
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                nama: document.getElementById('nama').value,
                role: document.getElementById('role').value,
                telepon: document.getElementById('telepon').value
            };

            try {
                const res = await fetch(`${API_BASE}/api/admin/users`, {
                    method: 'POST',
                    headers: adminHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Gagal menambah pengguna');
                }

                showAlert('✅ Pengguna berhasil ditambahkan!', 'success');
                resetForm();
                loadUsers();
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
            }
        });

        // Reset form
        function resetForm() {
            document.getElementById('userForm').reset();
        }

        // Open edit modal
        function openEditModal(id) {
            const user = users.find(u => u.id === id);
            if (!user) return;

            document.getElementById('editId').value = user.id;
            document.getElementById('editEmail').value = user.email;
            document.getElementById('editNama').value = user.nama;
            document.getElementById('editRole').value = user.role;
            document.getElementById('editTelepon').value = user.telepon || '';
            document.getElementById('editPassword').value = '';

            document.getElementById('editModal').classList.add('active');
        }

        // Close edit modal
        function closeEditModal() {
            document.getElementById('editModal').classList.remove('active');
        }

        // Update user
        async function updateUser() {
            const id = document.getElementById('editId').value;
            const data = {
                email: document.getElementById('editEmail').value,
                nama: document.getElementById('editNama').value,
                role: document.getElementById('editRole').value,
                telepon: document.getElementById('editTelepon').value
            };

            const password = document.getElementById('editPassword').value;
            if (password) {
                if (password.length < 8) {
                    showAlert('❌ Password minimal 8 karakter', 'error');
                    return;
                }
                data.password = password;
            }

            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}`, {
                    method: 'PUT',
                    headers: adminHeaders({ 'Content-Type': 'application/json' }),
                    body: JSON.stringify(data)
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Gagal mengupdate pengguna');
                }

                showAlert('✅ Pengguna berhasil diupdate!', 'success');
                closeEditModal();
                loadUsers();
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
            }
        }

        // Delete user
        async function deleteUser(id, email) {
            if (!confirm(`Yakin ingin menghapus user: ${email}?`)) return;

            try {
                const res = await fetch(`${API_BASE}/api/admin/users/${id}`, {
                    method: 'DELETE',
                    headers: adminHeaders()
                });

                if (!res.ok) {
                    const err = await res.json();
                    throw new Error(err.message || 'Gagal menghapus pengguna');
                }

                showAlert('✅ Pengguna berhasil dihapus!', 'success');
                loadUsers();
            } catch (err) {
                showAlert('❌ ' + err.message, 'error');
            }
        }

        // Search
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase();
            const filtered = users.filter(u => 
                u.email.toLowerCase().includes(query) || 
                u.nama.toLowerCase().includes(query)
            );
            renderTable(filtered);
        });

        // Init
        document.getElementById('adminKey').value = getAdminKey();
        checkConnection();
        loadUsers();
        setInterval(checkConnection, 30000);
    </script>
</body>
</html>
